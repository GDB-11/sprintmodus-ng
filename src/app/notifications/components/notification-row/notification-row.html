@if (compact()) {
  <button appListButton type="button" (click)="opened.emit()">
    <span [class]="notification().isRead ? 'text-text-muted' : 'font-semibold text-text'">{{ description() }}</span>
    @if (!notification().isRead) {
      <app-chip tone="info">Sin leer</app-chip>
    }
  </button>
} @else {
  <div class="flex flex-wrap items-start justify-between gap-3 py-3">
    <div class="flex min-w-0 flex-1 flex-col gap-1">
      <a
        appTextLink
        [routerLink]="['/work-items', notification().workItem.workItemCode]"
        (click)="opened.emit()"
        class="w-fit text-sm"
        [class]="weight()"
        >{{ description() }}</a
      >
      <p class="flex flex-wrap items-center gap-2 text-sm text-text-muted">
        @if (!notification().isRead) {
          <app-chip tone="info">Sin leer</app-chip>
        }
        <time [attr.datetime]="notification().createdAt">{{ notification().createdAt | date: 'medium' }}</time>
      </p>
    </div>
    @if (!notification().isRead) {
      <button
        appButton
        variant="secondary"
        size="compact"
        type="button"
        [disabled]="working()"
        [attr.aria-label]="'Marcar como leída: ' + description()"
        (click)="markRead.emit()"
      >
        Marcar como leída
      </button>
    }
  </div>
}
