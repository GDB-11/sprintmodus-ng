<a
  routerLink="/notifications"
  [attr.aria-label]="label()"
  class="inline-flex items-center gap-2 rounded-md border border-neutral-700 px-3 py-1.5 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary-900 dark:border-neutral-400 dark:focus-visible:outline-secondary-400"
>
  Notificaciones
  @if (count() > 0) {
    <span
      aria-hidden="true"
      class="min-w-6 rounded-full bg-secondary-900 px-1.5 text-center text-xs font-semibold text-white dark:bg-secondary-400 dark:text-neutral-900"
      >{{ badge() }}</span
    >
  }
</a>
<span role="status" class="sr-only">{{ announcement() }}</span>
