<div class="flex flex-col gap-1.5">
  <label [for]="inputId()" class="text-sm font-medium text-text">{{ label() }}</label>
  <div class="relative">
    <app-icon name="search" class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-text-faint" />
    <input
      [id]="inputId()"
      type="search"
      [placeholder]="placeholder()"
      [value]="value()"
      (input)="value.set($any($event.target).value)"
      class="w-full rounded-md border border-control-border bg-control-track py-2 pr-3 pl-9 text-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary-900 dark:focus-visible:outline-secondary-400"
    />
  </div>
</div>
