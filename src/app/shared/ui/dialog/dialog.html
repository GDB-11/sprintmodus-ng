<dialog
  #dialogEl
  [attr.aria-labelledby]="headingId"
  (click)="onBackdropClick($event)"
  (close)="onNativeClose()"
  class="glass m-auto max-h-[90vh] w-[92vw] max-w-3xl overflow-y-auto p-0"
>
  @if (open()) {
    <div class="flex flex-col gap-4 p-4 sm:p-6">
      <div class="flex items-start justify-between gap-4">
        <h2 [id]="headingId" class="text-xl font-semibold text-text">{{ heading() }}</h2>
        <button type="button" appButton variant="secondary" size="icon" aria-label="Cerrar" (click)="open.set(false)">
          <app-icon name="x" />
        </button>
      </div>
      <ng-content />
    </div>
  }
</dialog>
