<div class="flex flex-col gap-1">
  <div class="flex items-center justify-between text-sm">
    <span class="font-medium text-text">{{ label() }}</span>
    <span class="text-text-muted">{{ value() }} / {{ max() }}</span>
  </div>
  <div class="h-1.5 w-full rounded-full bg-control-track" aria-hidden="true">
    <div class="h-full rounded-full bg-primary-500" [style.width.%]="percent()"></div>
  </div>
</div>
