<div class="flex -space-x-2">
  @for (name of visible(); track name) {
    <app-avatar [name]="name" class="rounded-full ring-2 ring-light-bg dark:ring-dark-bg" />
  }
  @if (overflow() > 0) {
    <span
      aria-hidden="true"
      class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-neutral-300 text-xs font-semibold text-neutral-900 ring-2 ring-light-bg dark:bg-neutral-600 dark:text-neutral-100 dark:ring-dark-bg"
      >+{{ overflow() }}</span
    >
  }
</div>
