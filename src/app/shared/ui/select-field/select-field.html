<div class="flex flex-col gap-1.5">
  <label [for]="inputId()" class="text-sm font-medium text-text">{{ label() }}</label>
  @if (searchable()) {
    <app-searchable-select
      [inputId]="inputId()"
      [label]="label()"
      [options]="options()"
      [formField]="field()"
      [describedBy]="describedBy()"
    />
  } @else {
    <app-select-menu
      [inputId]="inputId()"
      [label]="label()"
      [options]="options()"
      [formField]="field()"
      [describedBy]="describedBy()"
    />
  }
  @if (hint()) {
    <p [id]="hintId()" class="text-sm text-text-muted">{{ hint() }}</p>
  }
  @if (showError()) {
    <p [id]="errorId()" role="alert" class="text-sm font-medium text-error-800 dark:text-error-300">
      {{ errorMessage() }}
    </p>
  }
</div>
