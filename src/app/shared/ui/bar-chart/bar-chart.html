<div aria-hidden="true" class="flex h-36 items-end justify-around gap-2">
  @for (group of groups(); track group.label) {
    <div class="flex h-full min-w-0 flex-1 flex-col items-center justify-end gap-1.5">
      <div class="flex h-full w-full items-end justify-center gap-1">
        @for (value of group.values; track $index) {
          <div
            class="w-full max-w-6 rounded-t-md"
            [class]="seriesClass($index)"
            [style.height.%]="percent(value)"
          ></div>
        }
      </div>
      <span class="text-xs font-semibold text-text-muted">{{ group.label }}</span>
    </div>
  }
</div>
