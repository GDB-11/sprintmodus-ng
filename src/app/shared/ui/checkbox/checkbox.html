<label class="inline-flex items-start gap-2 text-sm text-text" [class.opacity-60]="disabled()">
  <span class="relative mt-px inline-flex shrink-0">
    <input
      type="checkbox"
      class="peer size-5 cursor-pointer appearance-none rounded-md border border-neutral-700 bg-control-track transition-colors duration-150 checked:border-primary-700 checked:bg-primary-700 hover:border-primary-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary-900 disabled:cursor-not-allowed dark:border-neutral-400 dark:checked:border-primary-700 dark:focus-visible:outline-secondary-400"
      [checked]="checked()"
      [disabled]="disabled()"
      [attr.aria-label]="ariaLabel() ?? null"
      (change)="onChange($event)"
    />
    <app-icon
      name="check"
      class="pointer-events-none absolute inset-0 m-auto h-3.5 w-3.5 text-white opacity-0 transition-opacity duration-150 peer-checked:opacity-100"
    />
  </span>
  <span class="min-w-0 empty:hidden"><ng-content /></span>
</label>
