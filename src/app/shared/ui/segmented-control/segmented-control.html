<div role="group" [attr.aria-label]="groupLabel()" class="inline-flex gap-0.5 rounded-md border border-control-border bg-control-track p-0.5">
  @for (option of options(); track option.value) {
    <button
      type="button"
      [attr.aria-pressed]="value() === option.value"
      [class]="optionClasses(option)"
      (click)="value.set(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
