<main class="wallpaper flex min-h-screen items-center justify-center p-4 text-text">
  <div class="glass relative w-full max-w-md p-6 sm:p-8">
    <div class="glass-highlight"></div>
    <div class="relative flex flex-col gap-4">
      <app-logo [markOnly]="true" />
      <h1 class="text-xl font-semibold">{{ heading() }}</h1>
      @if (subheading()) {
        <p class="text-text-muted">{{ subheading() }}</p>
      }
      <ng-content />
    </div>
  </div>
</main>
