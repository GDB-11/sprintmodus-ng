<app-auth-card heading="Iniciar sesión">
  <form [formRoot]="loginForm" class="flex flex-col gap-4">
    @if (errorMessage(); as message) {
      <app-banner kind="error">{{ message }}</app-banner>
    }
    <app-text-field
      [field]="loginForm.email"
      inputId="email"
      label="Correo electrónico"
      type="email"
      autocomplete="username"
    />
    <app-text-field
      [field]="loginForm.password"
      inputId="password"
      label="Contraseña"
      type="password"
      autocomplete="current-password"
    />
    <app-text-field
      [field]="loginForm.organizationCode"
      inputId="organizationCode"
      label="Código de organización"
    />
    <button appButton type="submit" [disabled]="loginForm().submitting()">
      {{ loginForm().submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
  <p class="text-center text-sm text-text-muted">
    ¿No tienes cuenta?
    <a appTextLink routerLink="/register">Regístrate</a>
  </p>
</app-auth-card>
