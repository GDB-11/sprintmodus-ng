<app-auth-card
  heading="Registra tu organización"
  subheading="Crea la organización y la cuenta de su propietario."
>
  <form [formRoot]="registerForm" class="flex flex-col gap-4">
    @if (errorMessage(); as message) {
      <app-banner kind="error">{{ message }}</app-banner>
    }
    <app-text-field
      [field]="registerForm.organizationName"
      inputId="organizationName"
      label="Nombre de la organización"
      autocomplete="organization"
    />
    <app-text-field
      [field]="registerForm.organizationCode"
      inputId="organizationCode"
      label="Código de organización"
      [hint]="codeHint()"
    />
    <app-text-field
      [field]="registerForm.fullName"
      inputId="fullName"
      label="Tu nombre completo"
      autocomplete="name"
    />
    <app-text-field
      [field]="registerForm.email"
      inputId="email"
      label="Correo electrónico"
      type="email"
      autocomplete="email"
    />
    <app-text-field
      [field]="registerForm.password"
      inputId="password"
      label="Contraseña"
      type="password"
      autocomplete="new-password"
      hint="Al menos 8 caracteres."
    />
    <button appButton type="submit" [disabled]="registerForm().submitting()">
      {{ registerForm().submitting() ? 'Creando organización…' : 'Crear organización' }}
    </button>
  </form>
  <p class="text-center text-sm text-text-muted">
    ¿Ya tienes cuenta?
    <a appTextLink routerLink="/login">Iniciar sesión</a>
  </p>
</app-auth-card>
