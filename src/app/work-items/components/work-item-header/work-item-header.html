@if (ancestors().length > 0) {
  <nav aria-label="Ruta del elemento" class="flex flex-wrap items-center gap-1.5 text-xs text-text-muted">
    @for (ancestor of ancestors(); track ancestor.workItemCode; let last = $last) {
      <a appTextLink [routerLink]="['/work-items', ancestor.workItemCode]" class="inline-flex items-center gap-1">
        <app-work-item-type-icon [type]="ancestor.type" />{{ ancestor.displayKey }} {{ ancestor.title }}
      </a>
      @if (!last) {
        <span aria-hidden="true">›</span>
      }
    }
  </nav>
}
<div class="flex flex-wrap items-center gap-2">
  <app-work-item-type-icon [type]="item().type" />
  <span class="text-xs font-semibold text-text-faint">{{ item().displayKey }}</span>
  <app-status-label [status]="item().status" />
</div>
<h1 class="text-2xl font-semibold text-text">{{ item().title }}</h1>
<div class="flex flex-wrap gap-2">
  <app-priority-chip [priority]="item().priority" />
  <app-chip>{{ item().sprintLabel }}</app-chip>
  <app-chip>{{ item().effortLabel }}</app-chip>
</div>
