<form [formRoot]="editForm" class="flex max-w-2xl flex-col gap-4">
  @if (errorMessage(); as message) {
    <app-banner kind="error">{{ message }}</app-banner>
  }
  <app-text-field [field]="editForm.title" inputId="edit-title" label="Título" />
  <app-textarea-field
    [field]="editForm.description"
    inputId="edit-description"
    label="Descripción"
  />
  <app-textarea-field
    [field]="editForm.acceptanceCriteria"
    inputId="edit-acceptanceCriteria"
    label="Criterios de aceptación"
    [rows]="3"
  />
  <app-select-field
    [field]="editForm.priority"
    inputId="edit-priority"
    label="Prioridad"
    [options]="priorityOptions"
  />
  <div class="grid gap-4 sm:grid-cols-3">
    <app-text-field
      [field]="editForm.effortPoints"
      inputId="edit-effortPoints"
      label="Puntos de esfuerzo"
    />
    <app-text-field
      [field]="editForm.estimatedHours"
      inputId="edit-estimatedHours"
      label="Horas estimadas"
    />
    <app-text-field
      [field]="editForm.remainingHours"
      inputId="edit-remainingHours"
      label="Horas restantes"
    />
  </div>
  <div class="flex gap-3">
    <button type="submit" appButton [disabled]="editForm().submitting()">
      {{ editForm().submitting() ? 'Guardando…' : 'Guardar cambios' }}
    </button>
    <button type="button" appButton variant="secondary" (click)="cancelled.emit()">Cancelar</button>
  </div>
</form>
