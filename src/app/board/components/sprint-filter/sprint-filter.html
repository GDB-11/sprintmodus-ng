<div class="flex flex-wrap items-center gap-x-6 gap-y-3">
  @for (group of groups(); track group.id) {
    <div role="group" [attr.aria-labelledby]="'sprints-' + group.id" class="flex flex-wrap items-center gap-2">
      <span [id]="'sprints-' + group.id" class="text-sm font-medium text-text-muted">{{ group.label }}</span>
      @for (sprint of group.sprints; track sprint.sprintCode) {
        <button
          type="button"
          appFilterChip
          [pressed]="selected() === sprint.sprintCode"
          (click)="selected.set(sprint.sprintCode)"
        >
          {{ sprint.name }} · {{ statusLabels[sprint.status] }}
          <span class="sr-only">, del {{ sprint.startDate | date: 'mediumDate' }} al {{ sprint.endDate | date: 'mediumDate' }}</span>
        </button>
      }
    </div>
  }
  <div role="group" aria-label="Otras vistas" class="flex flex-wrap items-center gap-2">
    <button type="button" appFilterChip [pressed]="selected() === backlog" (click)="selected.set(backlog)">Backlog (sin sprint)</button>
    <button type="button" appFilterChip [pressed]="selected() === allSprints" (click)="selected.set(allSprints)">Todos</button>
  </div>
  @if (others().length > 0) {
    <div class="flex items-center gap-2">
      <app-select-menu
        inputId="other-sprints"
        label="Otros sprints"
        placeholder="Otros sprints…"
        [options]="otherOptions()"
        [value]="otherSelected() ? selected() : ''"
        (valueChange)="chooseOther($event)"
      />
    </div>
  }
</div>
