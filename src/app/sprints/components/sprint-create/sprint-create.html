<app-panel heading="Nuevo sprint" class="max-w-2xl">
  @if (canAdminister()) {
    <form [formRoot]="sprintForm" class="flex flex-col gap-4">
      @if (errorMessage(); as message) {
        <app-banner kind="error">{{ message }}</app-banner>
      }
      <app-text-field [field]="sprintForm.name" inputId="sprint-name" label="Nombre" />
      <div class="grid gap-4 sm:grid-cols-2">
        <app-text-field
          [field]="sprintForm.startDate"
          inputId="sprint-start"
          label="Fecha de inicio"
          type="date"
          hint="Opcional. Si la dejas vacía empieza el próximo día de inicio configurado. Dura lo que dice la configuración."
        />
        <app-text-field
          [field]="sprintForm.plannedVelocity"
          inputId="sprint-planned"
          label="Puntos planificados"
          hint="Opcional."
        />
      </div>
      <div>
        <button appButton type="submit">Crear sprint</button>
      </div>
    </form>
  } @else {
    <app-disabled-reason reason="Solo los propietarios y administradores planifican los sprints." />
    <div>
      <button appButton type="button" disabled>Crear sprint</button>
    </div>
  }
</app-panel>
