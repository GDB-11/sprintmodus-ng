<app-page-header heading="Cambiar contraseña" />
<app-panel heading="Tu contraseña">
  <form [formRoot]="passwordForm" class="flex flex-col gap-4">
    @if (changed()) {
      <app-banner kind="success">Tu contraseña se cambió. Úsala la próxima vez que inicies sesión.</app-banner>
    }
    @if (errorMessage(); as message) {
      <app-banner kind="error">{{ message }}</app-banner>
    }
    <app-text-field
      [field]="passwordForm.currentPassword"
      inputId="current-password"
      label="Contraseña actual"
      type="password"
      autocomplete="current-password"
    />
    <app-text-field
      [field]="passwordForm.newPassword"
      inputId="new-password"
      label="Nueva contraseña"
      type="password"
      autocomplete="new-password"
      hint="Al menos 8 caracteres."
    />
    <app-text-field
      [field]="passwordForm.confirmPassword"
      inputId="confirm-password"
      label="Repite la nueva contraseña"
      type="password"
      autocomplete="new-password"
    />
    <div>
      <button appButton type="submit">Cambiar contraseña</button>
    </div>
  </form>
</app-panel>
