<div class="relative flex flex-col gap-1.5">
  <label [for]="inputId()" class="text-sm font-medium">{{ label() }}</label>
  <textarea
    #control
    appControl
    [id]="inputId()"
    [rows]="rows()"
    [formField]="field()"
    [attr.aria-required]="state().required()"
    [attr.aria-invalid]="showError()"
    [attr.aria-describedby]="describedBy()"
    aria-haspopup="listbox"
    aria-autocomplete="list"
    [attr.aria-controls]="open() ? listboxId() : null"
    [attr.aria-activedescendant]="activeOptionId()"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (input)="onInput()"
    (click)="syncCaret()"
    (keyup)="syncCaret()"
    (keydown)="onKeydown($event)"
  ></textarea>
  @if (open()) {
    <div class="absolute top-full z-10 mt-1 w-full max-w-sm">
      <app-menu-surface>
        <ul [id]="listboxId()" role="listbox" aria-label="Personas a las que mencionar">
          @for (person of results(); track person.userCode; let index = $index) {
            <li
              appMenuOption
              [id]="optionId(index)"
              role="option"
              [active]="index === activeIndex()"
              [attr.aria-selected]="index === activeIndex()"
              (mousedown)="$event.preventDefault()"
              (click)="pick(person)"
              (mouseenter)="activeIndex.set(index)"
            >
              {{ person.fullName }}
            </li>
          }
        </ul>
      </app-menu-surface>
    </div>
  }
  @if (hint()) {
    <p [id]="hintId()" class="text-sm text-text-muted">{{ hint() }}</p>
  }
  @if (showError()) {
    <app-field-error [id]="errorId()">{{ errorMessage() }}</app-field-error>
  }
  <p role="status" class="sr-only">{{ announcement() }}</p>
</div>
