<app-dialog [heading]="'Restablecer contraseña de ' + (member()?.fullName ?? '')" [(open)]="open">
  <form [formRoot]="resetForm" class="flex flex-col gap-4">
    @if (errorMessage(); as message) {
      <app-banner kind="error">{{ message }}</app-banner>
    }
    <app-text-field
      [field]="resetForm.password"
      inputId="reset-password"
      label="Nueva contraseña"
      [type]="showPassword() ? 'text' : 'password'"
      autocomplete="new-password"
      hint="Al menos 8 caracteres. Compártela con la persona fuera de la aplicación."
    />
    <div class="flex flex-wrap gap-2">
      <button appButton variant="secondary" size="compact" type="button" (click)="generate()">Generar</button>
      <button
        appButton
        variant="secondary"
        size="compact"
        type="button"
        [attr.aria-pressed]="showPassword()"
        (click)="toggleShowPassword()"
      >
        {{ showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña' }}
      </button>
    </div>
    <div>
      <button appButton type="submit">Cambiar contraseña</button>
    </div>
  </form>
</app-dialog>
